version: '3.8'

services:
  backend:
    image: tranthanhduongasd/mern-backend:1.0
    container_name: mern-backend-hub
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb+srv://Duong:Duong123@cluster0.2yse9ai.mongodb.net/cloud_lab?appName=Cluster0
    restart: always

  frontend:
    image: tranthanhduongasd/mern-frontend:1.0
    container_name: mern-frontend-hub
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always